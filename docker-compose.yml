# ==============================================================================
# DSAapp Architecture & Container Orchestration Template
# (Phase 1 Architectural Blueprint - For Production & Local Container Staging)
# ==============================================================================
services:
  # 1. Reverse Proxy / Gateway (Planned Production Boundary)
  gateway:
    image: nginx:1.27-alpine
    container_name: dsaapp-gateway
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

  # 2. Frontend React Client (Vite static build / Nginx shell)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dsaapp-frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    ports:
      - "5173:80"

  # 3. Backend API Gateway (FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dsaapp-backend
    restart: unless-stopped
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      # PRODUCTION: point this at the Neon pooled connection string.
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://dsaapp_user:dsaapp_secure_password@postgres:5432/dsaapp_prod}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - REDIS_REQUIRED=${REDIS_REQUIRED:-true}
      # PRODUCTION: must be a fresh 64+ character random value.
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set for production (64+ chars)}
      # PRODUCTION: list ONLY the deployed frontend origin.
      - CORS_ORIGINS=${CORS_ORIGINS:-["http://localhost"]}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-["dsaapp.com","backend","localhost","127.0.0.1"]}
      - SECURE_COOKIES=${SECURE_COOKIES:-true}
      # AI provider (server-side only; never exposed to the browser)
      - AI_PROVIDER=${AI_PROVIDER:-gemini}
      - GOOGLE_AI_API_KEY=${GOOGLE_AI_API_KEY:-}
      - AI_TIMEOUT_SECONDS=${AI_TIMEOUT_SECONDS:-30}
      # Online judge
      - JUDGE_SANDBOX_DRIVER=${JUDGE_SANDBOX_DRIVER:-docker}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # 4. Primary Relational Database (PostgreSQL 16)
  postgres:
    image: postgres:16-alpine
    container_name: dsaapp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dsaapp_user
      POSTGRES_PASSWORD: dsaapp_secure_password
      POSTGRES_DB: dsaapp_prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dsaapp_user -d dsaapp_prod"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 5. Cache & Job Broker (Redis 7)
  redis:
    image: redis:7-alpine
    container_name: dsaapp-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:
