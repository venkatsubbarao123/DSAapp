# ==============================================================================
# DSAapp Architecture & Container Orchestration Template
# (Phase 1 Architectural Blueprint - For Production & Local Container Staging)
# ==============================================================================
services:
  # 1. Reverse Proxy / Gateway (Planned Production Boundary)
  gateway:
    image: nginx:1.27-alpine
    container_name: dsaapp-gateway
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

  # 2. Frontend React Client (Vite static build / Nginx shell)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dsaapp-frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    ports:
      - "5173:80"

  # 3. Backend API Gateway (FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dsaapp-backend
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://dsaapp_user:dsaapp_secure_password@postgres:5432/dsaapp_prod
      - REDIS_URL=redis://redis:6379/0
      - REDIS_REQUIRED=true
      - SECRET_KEY=replace_with_a_64_character_hex_random_key_in_production_environment_here
      - CORS_ORIGINS=["https://dsaapp.com"]
      - ALLOWED_HOSTS=["dsaapp.com","backend"]
      - SECURE_COOKIES=true
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 4. Primary Relational Database (PostgreSQL 16)
  postgres:
    image: postgres:16-alpine
    container_name: dsaapp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dsaapp_user
      POSTGRES_PASSWORD: dsaapp_secure_password
      POSTGRES_DB: dsaapp_prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dsaapp_user -d dsaapp_prod"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 5. Cache & Job Broker (Redis 7)
  redis:
    image: redis:7-alpine
    container_name: dsaapp-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:
