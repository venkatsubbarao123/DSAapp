# ==============================================================================
# DSAapp — Netlify deployment configuration
#
# The SPA uses history-based routing, so every unknown path must be rewritten
# to /index.html or a page refresh on a deep link (e.g. /problems/two-sum)
# would return 404 from the static host.
# =============================================================================

[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Set this in the Netlify UI (Site settings -> Environment variables).
# It MUST point at the deployed backend origin, e.g. https://api.dsaapp.com
# VITE_API_BASE_URL = "https://api.dsaapp.com"

[[redirects]]
  from = "/api/*"
  to = "/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/health"
  to = "/health"
  status = 200

# SPA history fallback — must be the LAST redirect.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"